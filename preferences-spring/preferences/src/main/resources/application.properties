spring.application.name=demo

# SQLite database file (override with the DB_URL environment variable)
spring.datasource.url=${DB_URL:jdbc:sqlite:preferences.db}
spring.datasource.driver-class-name=org.sqlite.JDBC
# SQLite allows only one writer at a time; a single connection avoids "database is locked" errors
spring.datasource.hikari.maximum-pool-size=1

# Create the Spring Session tables (SPRING_SESSION, SPRING_SESSION_ATTRIBUTES) on startup if missing
spring.session.jdbc.initialize-schema=always
spring.session.jdbc.platform=sqlite

# JPA: create/update tables from entities (e.g. the users table)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect

# Default port 8080; override with SERVER_PORT
server.port=${SERVER_PORT:8080}

# HTTPS with the mkcert certificate for davidharris.net (also covers www.davidharris.net,
# localhost and 127.0.0.1), signed by the local mkcert CA. Override with SSL_CERT and SSL_KEY.
server.ssl.enabled=true
server.ssl.certificate=${SSL_CERT:file:${HOME}/certs/davidharris.net/davidharris.net.pem}
server.ssl.certificate-private-key=${SSL_KEY:file:${HOME}/certs/davidharris.net/davidharris.net-key.pem}
# The session cookie is only sent over HTTPS
server.servlet.session.cookie.secure=true

# Swagger UI (springdoc): https://davidharris.net:8080/swagger-ui.html
# The OpenAPI "servers" entry: Swagger UI's "Try it out" sends its requests here
openapi.server-url=${OPENAPI_SERVER_URL:https://davidharris.net:8080}
springdoc.swagger-ui.try-it-out-enabled=true
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.display-request-duration=true
